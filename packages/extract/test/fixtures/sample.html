<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tokenscout fixture</title>
    <style>
      :root { font-size: 16px; }
      body { margin: 0; background: #ffffff; color: #111827; font-size: 16px; }
      h1 { color: #3a7bd5; font-size: 32px; margin-bottom: 24px; }
      h2 { color: #3b7cd6; font-size: 24px; margin-bottom: 16px; }
      .card { background: #f5f5f5; padding: 16px; border-top: 2px solid #e23744; }
      .cta {
        background: #3a7bd5;
        color: #ffffff;
        padding: 8px;
        font-size: 20px;
        transition: background-color 0.3s ease-in-out;
      }
      .grid { display: flex; column-gap: 32px; row-gap: 8px; }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      h1 { animation: fade-in 500ms ease; }
    </style>
  </head>
  <body>
    <h1>Heading</h1>
    <h2>Subheading</h2>
    <div class="grid">
      <div class="card">Card</div>
      <a class="cta" href="#more">Call to action</a>
    </div>
  </body>
</html>
