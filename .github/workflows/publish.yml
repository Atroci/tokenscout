name: Publish

# Publishes the `tokenscout` core package to npm when a GitHub Release is
# published. Never auto-fires on push — you cut the release, this runs.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret. Configure the
# trusted publisher on npmjs.com (Atroci/tokenscout, workflow `publish.yml`)
# and publishes are attested with `--provenance`, linking the npm page back to
# the exact GitHub commit that built it.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm (OIDC support landed in 11.5).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build + test core
        run: |
          npm run build -w tokenscout
          npm run test -w tokenscout

      - name: Publish tokenscout with provenance
        run: npm publish --provenance --access public
        working-directory: packages/core
