name: Publish

# Publishes the three tokenscout packages to npm when a GitHub Release is
# published. Never auto-fires on push — you cut the release, this runs.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret. Configure the
# trusted publisher on npmjs.com (Atroci/tokenscout, workflow `publish.yml`)
# and publishes are attested with `--provenance`, linking the npm page back to
# the exact GitHub commit that built it.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm (OIDC support landed in 11.5).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build + test core
        run: |
          npm run build -w tokenscout
          npm run test -w tokenscout

      # Idempotent + resilient publish. A SUCCESSFUL publish must never go red.
      # `npm publish` can exit non-zero on a transient post-publish confirmation
      # 404 even though the package + provenance attestation landed (seen in
      # v0.3.0). It also exits non-zero on EPUBLISHCONFLICT during a re-run.
      # In both cases we cross-check the live registry: if the exact intended
      # version is published, the run is a success.
      - name: Publish tokenscout with provenance
        working-directory: packages/core
        run: |
          set +e
          npm publish --provenance --access public
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "npm publish exited cleanly."
            exit 0
          fi

          echo "npm publish exited $code — cross-checking the registry before failing."
          want=$(node -p "require('./package.json').version")
          live=$(npm view "tokenscout@$want" version 2>/dev/null || true)

          if [ "$live" = "$want" ]; then
            echo "tokenscout@$want is live on the registry — the artifact published despite the transient error (exit $code). Treating as success."
            exit 0
          fi

          echo "tokenscout@$want is NOT on the registry (npm view returned '${live:-<none>}') — this is a real failure."
          exit "$code"

      # Publish @tokenscout/extract after core (it depends on tokenscout@^0.x).
      # CI runs the browser smoke tests on every push/PR for this commit, so the
      # publish gate stays at build + typecheck here (no Chromium needed).
      - name: Build + typecheck extract
        run: |
          npm run build -w @tokenscout/extract
          npm run typecheck -w @tokenscout/extract

      - name: Publish @tokenscout/extract with provenance
        working-directory: packages/extract
        run: |
          set +e
          npm publish --provenance --access public
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "npm publish exited cleanly."
            exit 0
          fi

          echo "npm publish exited $code — cross-checking the registry before failing."
          want=$(node -p "require('./package.json').version")
          live=$(npm view "@tokenscout/extract@$want" version 2>/dev/null || true)

          if [ "$live" = "$want" ]; then
            echo "@tokenscout/extract@$want is live on the registry — treating as success."
            exit 0
          fi

          echo "@tokenscout/extract@$want is NOT on the registry (npm view returned '${live:-<none>}') — this is a real failure."
          exit "$code"

      - name: Build + test transform
        run: |
          npm run build -w @tokenscout/transform
          npm run test -w @tokenscout/transform

      - name: Publish @tokenscout/transform with provenance
        working-directory: packages/transform
        run: |
          set +e
          npm publish --provenance --access public
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "npm publish exited cleanly."
            exit 0
          fi

          echo "npm publish exited $code — cross-checking the registry before failing."
          want=$(node -p "require('./package.json').version")
          live=$(npm view "@tokenscout/transform@$want" version 2>/dev/null || true)

          if [ "$live" = "$want" ]; then
            echo "@tokenscout/transform@$want is live on the registry — treating as success."
            exit 0
          fi

          echo "@tokenscout/transform@$want is NOT on the registry (npm view returned '${live:-<none>}') — this is a real failure."
          exit "$code"
