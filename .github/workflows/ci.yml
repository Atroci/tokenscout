name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build core
        run: npm run build -w tokenscout
      - name: Typecheck core
        run: npm run typecheck -w tokenscout
      - name: Test core
        run: npm run test -w tokenscout
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  extract:
    name: Extract (browser smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build core (dependency)
        run: npm run build -w tokenscout
      - name: Build extract
        run: npm run build -w @tokenscout/extract
      - name: Typecheck extract
        run: npm run typecheck -w @tokenscout/extract
      - name: Test extract
        run: npm run test -w @tokenscout/extract
